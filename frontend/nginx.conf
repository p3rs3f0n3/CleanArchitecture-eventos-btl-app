server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router usa BrowserRouter (rutas tipo /eventos/123): sin esto,
    # recargar la página en una ruta que no es "/" tira 404 de Nginx porque
    # ese archivo no existe en disco. Todo lo que no sea un archivo real cae
    # a index.html y React Router resuelve la ruta en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
