services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventos_btl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventos_btl}
      POSTGRES_DB: ${POSTGRES_DB:-eventos_btl}
    volumes:
      # OJO: postgres:18 cambió el punto de montaje esperado — ya NO es
      # ".../data" (eso era hasta la 17). Montar en ".../data" hace que el
      # contenedor se niegue a arrancar ("these Docker images are configured
      # to store database data in a format which is compatible with
      # pg_ctlcluster"). El punto de montaje ahora es el padre.
      - postgres_data:/var/lib/postgresql
    ports:
      # 127.0.0.1 también acá: para administrar/revisar datos con un
      # cliente gráfico desde tu máquina, sin exponerlo a internet — se
      # llega por túnel SSH (ssh -L 5490:127.0.0.1:5490 nelly@66.94.101.47),
      # igual que el patrón ya usado con chatbot-postgres.
      - "127.0.0.1:5490:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventos_btl} -d ${POSTGRES_DB:-eventos_btl}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventos_btl}:${POSTGRES_PASSWORD:-eventos_btl}@postgres:5432/${POSTGRES_DB:-eventos_btl}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en tu .env antes de levantar el stack}
      # Dominio público real del backend en producción — las fotos subidas arman su URL con esto.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4101}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Sin esto, las fotos subidas (personal/eventos/informes) se pierden
      # cada vez que se recrea el contenedor — ver ARQUITECTURA.md.
      - backend_uploads:/app/uploads
    ports:
      # 127.0.0.1, no "4101:3000" a secas: sin esto Docker publica en
      # 0.0.0.0 (abierto a internet). Regla fija de este VPS desde el
      # endurecimiento de perímetro de 2026-09-19 — lo público entra por
      # Caddy, nunca por un puerto de Docker expuesto directo.
      - "127.0.0.1:4101:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Se inlinea en el JS al buildear (Vite) — tiene que ser la URL pública
        # real del backend, no el nombre interno "backend" de este compose.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4101/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4180:80"
    healthcheck:
      # nginx:alpine trae wget (busybox) pero no curl.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  backend_uploads:
